<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ศูนย์รวมระบบเทรดอัจฉริยะ - วงล้อเลือกเครื่องมือ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: radial-gradient(circle at center, #fffbfc 0%, #f7edff 50%, #eee1ff 100%);
      color: #3b0764;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(rgba(168, 85, 247, 0.12) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .header-tag {
      position: absolute;
      top: 32px;
      text-align: center;
      z-index: 10;
      padding: 0 16px;
      animation: fadeInDown 0.8s ease;
    }

    .header-tag h5 {
      font-weight: 700;
      color: #581c87;
      margin-bottom: 4px;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    .header-tag p {
      font-size: 0.8rem;
      color: #9333ea;
      margin: 0;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #e9d5ff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.08);
    }

    .hub-center-launch {
      position: relative;
      z-index: 20;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f0ff 100%);
      border: 4px solid #a855f7;
      box-shadow: 0 12px 35px rgba(168, 85, 247, 0.3), inset 0 0 25px rgba(232, 121, 249, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: floatBadge 3s ease-in-out infinite;
    }
    .hub-center-launch:hover {
      transform: scale(1.1) rotate(3deg);
      border-color: #9333ea;
      box-shadow: 0 18px 45px rgba(168, 85, 247, 0.45);
    }
    .hub-center-launch i {
      font-size: 2.8rem;
      color: #a855f7;
      transition: transform 0.4s;
      filter: drop-shadow(0 4px 8px rgba(168, 85, 247, 0.25));
    }
    .hub-center-launch:hover i {
      transform: scale(1.15) rotate(15deg);
    }
    .hub-center-launch span {
      font-size: 0.88rem;
      font-weight: 700;
      color: #6b21a8;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* วงล้อเลือกระบบ (ครบ 8 ช่องตามเดิม) */
    .wheel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(76, 29, 149, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      touch-action: none;
    }
    .wheel-overlay.active { opacity: 1; visibility: visible; }

    .radial-container {
      position: relative;
      width: min(92vw, 470px);
      height: min(92vw, 470px);
      display: flex;
      justify-content: center;
      align-items: center;
      transform: scale(0.8);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .wheel-overlay.active .radial-container { transform: scale(1); }

    .wheel-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      filter: drop-shadow(0 12px 30px rgba(76, 29, 149, 0.25));
    }
    .wheel-slice {
      fill: #ffffff;
      stroke: #e9d5ff;
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.18s ease-out;
    }
    .wheel-slice.active {
      fill: #f5f0ff;
      stroke: #a855f7;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.5));
    }
    .wheel-slice.empty-slot {
      fill: #fbf9ff;
      stroke: #f3e8ff;
    }
    .wheel-slice.empty-slot.active {
      fill: #f5f0ff;
      stroke: #d8b4fe;
    }

    .slice-icon-group {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, color 0.18s ease;
      color: #7e22ce;
      text-align: center;
      width: 75px;
    }
    .slice-icon-group.active {
      color: #581c87;
      transform: translate(-50%, -50%) scale(1.15);
      font-weight: 700;
    }
    .slice-icon-group i { font-size: 1.4rem; margin-bottom: 2px; color: #a855f7; }
    .slice-icon-group.empty i { color: #d8b4fe; }
    .slice-icon-group span { font-size: 0.62rem; white-space: nowrap; font-weight: 600; }

    /* แกนกลาง Center HUD */
    .center-hud {
      position: relative;
      width: min(34vw, 165px);
      height: min(34vw, 165px);
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #fdf4ff);
      border: 4px solid #a855f7;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.28);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-cat {
      font-size: 0.62rem;
      color: #c084fc;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hud-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #581c87;
      margin: 2px 0 4px 0;
      white-space: nowrap;
    }
    .hud-desc {
      font-size: 0.62rem;
      color: #6b7280;
      line-height: 1.25;
      padding: 0 4px;
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: #ffffff;
      border: 2px solid #a855f7;
      color: #a855f7;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.25s;
      z-index: 120;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
    }
    .close-btn:hover {
      background: #a855f7;
      color: #ffffff;
      transform: rotate(90deg) scale(1.05);
    }

    .bottom-hint {
      position: absolute;
      bottom: 28px;
      font-size: 0.75rem;
      color: #f3e8ff;
      text-align: center;
      width: 100%;
      font-weight: 500;
      background: rgba(88, 28, 135, 0.35);
      padding: 6px 0;
      backdrop-filter: blur(4px);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="header-tag">
    <h5>🌸 ศูนย์รวมระบบเทรดอัจฉริยะ 🌸</h5>
    <p>✨ แตะปุ่มตรงกลางเพื่อเปิดวงล้อเลือกห้องเรียนและเครื่องมือ ✨</p>
  </div>

  <button class="hub-center-launch" id="launchBtn" onclick="openWheel()">
    <i class="bi bi-stars"></i>
    <span>เปิดวงล้อระบบ</span>
  </button>

  <!-- OVERLAY WHEEL (ครบ 8 ช่อง: 3 ช่องจริง + 5 ช่องว่าง) -->
  <div class="wheel-overlay" id="wheelOverlay">
    <button class="close-btn" onclick="closeWheel()"><i class="bi bi-x-lg"></i></button>

    <div class="radial-container" id="radialContainer">
      <svg class="wheel-svg" viewBox="0 0 500 500" id="wheelSvg"></svg>
      <div id="iconsContainer"></div>

      <div class="center-hud">
        <span class="hud-cat" id="hudCat">ช่องที่ 1</span>
        <h4 class="hud-title" id="hudTitle">เรียนฟอเร็กซ์</h4>
        <span class="hud-desc" id="hudDesc">4 เสาหลัก, บันทึกเทรดส่วนตัว และคลังความรู้</span>
      </div>
    </div>

    <div class="bottom-hint">✨ เลื่อนเมาส์หรือลากนิ้วบนวงล้อเพื่อเลือก • แตะเพื่อเข้าสู่ระบบ ✨</div>
  </div>

  <script>
    // กลับมาครบ 8 ช่องเหมือนเดิม (3 ระบบจริง + 5 ช่องว่างที่เตรียมไว้)
    const wheelSlots = [
      { id: 0, title: "เรียนฟอเร็กซ์", cat: "ระบบหลัก 01", desc: "4 เสาหลัก, บันทึกเทรดส่วนตัว และคลังความรู้", icon: "bi-journal-bookmark-fill", link: "forex-lessons.html", empty: false },
      { id: 1, title: "10 สินทรัพย์โลก", cat: "ระบบวิเคราะห์ 02", desc: "กราฟสด 10 จอ: คู่เงินหลัก 7 คู่, ทองคำ, บิตคอยน์, น้ำมัน", icon: "bi-grid-1x2-fill", link: "multi-chart.html", empty: false },
      { id: 2, title: "เรดาร์ค่าเงิน", cat: "ระบบวิเคราะห์ 03", desc: "วัดความแข็งแกร่ง 8 สกุลเงิน & จับคู่เทรด Strong vs Weak", icon: "bi-speedometer2", link: "strength-meter.html", empty: false },
      { id: 3, title: "ช่องว่าง 4", cat: "พื้นที่ว่าง 04", desc: "พื้นที่ว่างเตรียมพัฒนาโปรเจกต์ใหม่", icon: "bi-plus-circle-dotted", link: "#", empty: true },
      { id: 4, title: "ช่องว่าง 5", cat: "พื้นที่ว่าง 05", desc: "พื้นที่ว่างเตรียมพัฒนาโปรเจกต์ใหม่", icon: "bi-plus-circle-dotted", link: "#", empty: true },
      { id: 5, title: "ช่องว่าง 6", cat: "พื้นที่ว่าง 06", desc: "พื้นที่ว่างเตรียมพัฒนาโปรเจกต์ใหม่", icon: "bi-plus-circle-dotted", link: "#", empty: true },
      { id: 6, title: "ช่องว่าง 7", cat: "พื้นที่ว่าง 07", desc: "พื้นที่ว่างเตรียมพัฒนาโปรเจกต์ใหม่", icon: "bi-plus-circle-dotted", link: "#", empty: true },
      { id: 7, title: "ช่องว่าง 8", cat: "พื้นที่ว่าง 08", desc: "พื้นที่ว่างเตรียมพัฒนาโปรเจกต์ใหม่", icon: "bi-plus-circle-dotted", link: "#", empty: true }
    ];

    let currentSelectedIdx = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSoftSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hover') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(987.77, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'open') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      }
    }

    function initWheel() {
      const svg = document.getElementById('wheelSvg');
      const iconsBox = document.getElementById('iconsContainer');
      const cx = 250, cy = 250;
      const rIn = 100;
      const rOut = 236;
      const numSlots = wheelSlots.length; // 8 ช่อง
      const angleStep = 360 / numSlots;
      const gap = 2.8;

      svg.innerHTML = '';
      iconsBox.innerHTML = '';

      wheelSlots.forEach((slot, i) => {
        const startAngle = i * angleStep - 90 + gap / 2;
        const endAngle = (i + 1) * angleStep - 90 - gap / 2;

        const pathD = describeArc(cx, cy, rIn, rOut, startAngle, endAngle);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathD);
        path.setAttribute("class", `wheel-slice slice-${i} ${slot.empty ? 'empty-slot' : ''}`);
        path.setAttribute("id", `slice-${i}`);
        path.onclick = () => executeSlot(i);
        svg.appendChild(path);

        const midAngle = (startAngle + endAngle) / 2;
        const iconRadius = (rIn + rOut) / 2;
        const iconPos = polarToCartesian(cx, cy, iconRadius, midAngle);

        const iconGroup = document.createElement('div');
        iconGroup.className = `slice-icon-group icon-group-${i} ${slot.empty ? 'empty' : ''}`;
        iconGroup.id = `icon-${i}`;
        iconGroup.style.left = `${(iconPos.x / 500) * 100}%`;
        iconGroup.style.top = `${(iconPos.y / 500) * 100}%`;
        iconGroup.innerHTML = `<i class="bi ${slot.icon}"></i><span>${slot.title}</span>`;
        iconsBox.appendChild(iconGroup);
      });

      selectSlot(0);
    }

    function polarToCartesian(cx, cy, r, angleInDegrees) {
      const rad = (angleInDegrees * Math.PI) / 180.0;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function describeArc(x, y, rIn, rOut, startAngle, endAngle) {
      const p1 = polarToCartesian(x, y, rOut, startAngle);
      const p2 = polarToCartesian(x, y, rOut, endAngle);
      const p3 = polarToCartesian(x, y, rIn, endAngle);
      const p4 = polarToCartesian(x, y, rIn, startAngle);
      return `M ${p1.x} ${p1.y} A ${rOut} ${rOut} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rIn} ${rIn} 0 0 0 ${p4.x} ${p4.y} Z`;
    }

    function selectSlot(idx) {
      if (currentSelectedIdx !== idx) playSoftSound('hover');
      currentSelectedIdx = idx;

      document.querySelectorAll('.wheel-slice').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.slice-icon-group').forEach(ic => ic.classList.remove('active'));

      const activeSlice = document.getElementById(`slice-${idx}`);
      const activeIcon = document.getElementById(`icon-${idx}`);
      if (activeSlice) activeSlice.classList.add('active');
      if (activeIcon) activeIcon.classList.add('active');

      const data = wheelSlots[idx];
      document.getElementById('hudCat').innerText = data.cat;
      document.getElementById('hudTitle').innerText = data.title;
      document.getElementById('hudDesc').innerText = data.desc;
    }

    function executeSlot(idx) {
      const data = wheelSlots[idx];
      if (data && data.link && data.link !== '#') {
        window.location.href = data.link;
      } else {
        alert('🌸 ' + data.title + ' เป็นช่องว่างที่เปิดไว้ให้คุณนำไปใส่ระบบหรือโปรเจกต์ใหม่ได้เลยค่ะ');
      }
    }

    function handlePointerMove(clientX, clientY) {
      const container = document.getElementById('radialContainer');
      const rect = container.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 45) {
        let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        if (angle < 0) angle += 360;

        const numSlots = wheelSlots.length;
        const step = 360 / numSlots;
        const targetIdx = Math.floor(angle / step) % numSlots;

        selectSlot(targetIdx);
      }
    }

    const overlay = document.getElementById('wheelOverlay');
    overlay.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    overlay.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target.classList.contains('wheel-slice') || e.target.closest('.center-hud')) {
        executeSlot(currentSelectedIdx);
      }
    });

    function openWheel() {
      overlay.classList.add('active');
      playSoftSound('open');
    }

    function closeWheel() {
      overlay.classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeWheel();
    });

    document.addEventListener('DOMContentLoaded', initWheel);
  </script>
</body>
</html>
